<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <meta name="description" content="Portfolio of classroom and educational games." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="nav">
      <div class="wrap nav__inner">
        <a class="nav__brand" href="#top" data-bind="name"></a>
        <nav class="nav__links" aria-label="Main">
          <a href="#work">Work</a>
          <a href="#about">About</a>
          <a href="#contact">Contact</a>
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
          </button>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="hero wrap" id="top">
        <p class="hero__badge" hidden><span class="dot"></span>Available for projects</p>
        <h1 class="hero__title">
          <span data-bind="name"></span><br />
          <em data-bind="role"></em>
        </h1>
        <p class="hero__tagline" data-bind="tagline"></p>
        <div class="hero__cta">
          <a class="btn btn--primary" href="#work">See my work</a>
          <a class="btn" href="#contact">Get in touch</a>
        </div>
        <ul class="stats" id="stats"></ul>
      </section>

      <section class="section wrap" id="work">
        <div class="section__head">
          <h2>Selected work</h2>
          <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
        </div>
        <div class="grid" id="projects"></div>
      </section>

      <section class="section wrap about" id="about">
        <h2>About</h2>
        <div class="about__body" id="about-text"></div>
        <div class="skills" id="skills"></div>
      </section>

      <section class="section wrap contact" id="contact">
        <h2>Let's make something students love.</h2>
        <p>Have a classroom, curriculum or game idea in mind? I'd love to hear about it.</p>
        <a class="btn btn--primary btn--lg" id="email-link" href="#"></a>
        <ul class="socials" id="socials"></ul>
      </section>
    </main>

    <footer class="footer wrap">
      <p>© <span id="year"></span> <span data-bind="name"></span> · <span data-bind="location"></span></p>
    </footer>

    <dialog class="modal" id="modal">
      <button class="modal__close" type="button" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </dialog>

    <script src="content.js"></script>
    <script src="app.js"></script>
  </body>
</html>
